name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (fatal errors only)
      run: |
        flake8 defihunter --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests
      run: pytest tests/ -q --tb=long -rA

  foundry:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Ensure forge-std present (vendored lib should be committed)
      run: |
        [ -d lab/lib/forge-std/src ] || (cd lab && forge install foundry-rs/forge-std --no-commit)

    - name: Export template PoCs into the lab
      run: python3 scripts/export_templates.py

    - name: Forge build (compiles all templates + mocks)
      working-directory: lab
      run: forge build

    - name: Forge test (proves every template exploit)
      working-directory: lab
      run: forge test

    - name: CLI integration check
      run: |
        pip install -e .
        defihunter templates verify
        defihunter templates list --type all
